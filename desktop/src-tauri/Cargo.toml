[package]
name = "shotforward-desktop"
version = "0.1.0"
description = "ShotForward desktop shell"
authors = ["ShotForward"]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-shell = "2.3.6"
tauri-plugin-dialog = "2"
reqwest = { version = "0.13.5", default-features = false }
url = "2"

[profile.release]
codegen-units = 16
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
